<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Phi · Advertisement Card</title><meta name="description" content="Build Phi advertisement-card reference implementation."><style>
*{box-sizing:border-box}body{margin:0;background:#fff8eb;color:#2b1707;font-family:Arial,sans-serif}.wrap{max-width:880px;margin:auto;padding:20px}.card{overflow:hidden;border:2px solid #fb923c;border-radius:28px;background:linear-gradient(135deg,#f97316,#c2410c);color:#fff;box-shadow:0 20px 50px #7c2d1233}.photo{display:grid;place-items:center;min-height:310px;padding:24px;background:#ffedd5}.photo img{max-width:100%;max-height:290px;object-fit:contain;filter:drop-shadow(0 14px 15px #0005)}.body{padding:26px}.tag{display:inline-block;background:#fff;color:#7c2d12;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}h1{font-size:34px;margin:15px 0 8px}.price{font-size:28px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button,a.btn{border:1px solid #fff9;border-radius:999px;padding:13px 14px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer;font-size:15px}.buy{background:#fff;color:#ea580c;border:2px solid #fff}.secondary{background:#ffffff16;color:#fff}.collect{background:#fff;color:#7c2d12}.note{font-size:12px;color:#ffedd5}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cart{font-weight:900;color:#9a3412;text-decoration:none}@media(min-width:720px){.card{display:grid;grid-template-columns:1fr 1.15fr}.photo{min-height:100%}}
</style></head><body><main class="wrap"><div class="top"><strong>Build Phi</strong><a class="cart" href="https://www-infinity4.github.io/Shop-Phi/?view=cart">🛒 Shopping Cart <span id="count">0</span></a></div><article class="card"><div class="photo"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Mercury_dime.jpg" alt="Representative stock photo of a Mercury dime"></div><div class="body"><span class="tag">Advertisement</span><h1>Mercury dime</h1><p>Representative/random Mercury dime advertisement. The stock image does not identify a specific year, mint, condition, or seller-held coin.</p><div class="price">100 Quants</div><div class="actions"><button class="buy" type="button">Buy It Now</button><button id="collect" class="collect" type="button">Collect</button><button id="share" class="secondary" type="button">Share · +0.1 StarCoin</button><a class="btn secondary" href="https://www-infinity4.github.io/Shop-Phi/?q=Mercury%20dime">Shop Phi · similar items</a></div><p class="note">Test advertisement. No wallet debit or physical shipment.</p></div></article></main><script defer src="https://www-infinity4.github.io/Control-Phi/control-phi.js" data-control-phi-wallet-only="true"></script><script>
const KEY='infinity_phi_shop_cart_v1',ID='test-random-mercury-dime';const listing={id:ID,title:'Mercury dime',priceLabel:'100 Quants',imageUrl:'https://commons.wikimedia.org/wiki/Special:FilePath/Mercury_dime.jpg',description:'Representative/random Mercury dime test advertisement.',collectedAt:new Date().toISOString()};
function items(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function paint(){const x=items(),yes=x.some(i=>i&&i.id===ID);document.getElementById('collect').textContent=yes?'Collected ✓':'Collect';document.getElementById('count').textContent=String(x.length)}
document.getElementById('collect').onclick=()=>{const x=items().filter(i=>i&&i.id!==ID);x.unshift({...listing,collectedAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(x.slice(0,100)));paint();window.dispatchEvent(new CustomEvent('infinity-shop-cart-updated',{detail:{item:listing}}));window.ControlPhi?.ensureActionCredit?.(ID,'collect')};
document.getElementById('share').onclick=async()=>{const data={title:'Mercury dime · Advertisement',text:'Mercury dime · 100 Quants · Build Phi test advertisement',url:location.href};try{if(navigator.share)await navigator.share(data);else await navigator.clipboard.writeText(data.text+' '+data.url)}catch{return}window.ControlPhi?.ensureShareCredit?.(location.href,'advertisement')};paint();window.addEventListener('storage',e=>{if(e.key===KEY)paint()});
</script></body></html>
